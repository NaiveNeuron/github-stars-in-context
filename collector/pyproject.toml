[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-h-index"
version = "0.1.0"
description = "Measuring Developer Impact on GitHub Using the h-Index"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "duckdb",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "python-dotenv",
    "joblib",
    "typer",
    "rich",
]

[tool.hatch.build.targets.wheel]
packages = ["data_fetching", "data_analysis", "data_storage", "utils"]
include = ["config.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", ]
ignore = ["E501", "E701"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]
